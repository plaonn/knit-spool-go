name: Upstream drift

# Weekly check for upstream Knit changes past the pins in knit-reference.lock, plus a run of the latest
# released Knit client against this daemon. It reports; it never moves a pin.
# See CONTRIBUTING.md#tracking-upstream-knit. Runs from other branches never touch issues.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-drift
  cancel-in-progress: false

jobs:
  detect:
    name: Compare pins with upstream Knit
    runs-on: ubuntu-latest
    outputs:
      drift: ${{ steps.drift.outputs.drift }}
      level: ${{ steps.drift.outputs.level }}
      drift_key: ${{ steps.drift.outputs.drift_key }}
      reference_repo: ${{ steps.drift.outputs.reference_repo }}
      reference_release: ${{ steps.drift.outputs.reference_release }}
      reference_release_commit: ${{ steps.drift.outputs.reference_release_commit }}
      reference_release_newer: ${{ steps.drift.outputs.reference_release_newer }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build drift report
        id: drift
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/drift"
          python3 -I scripts/knit_drift.py \
            --report "$RUNNER_TEMP/drift/report.md" \
            --issue-body "$RUNNER_TEMP/drift/issue-body.md" \
            --run-url "$RUN_URL"
          cat "$RUNNER_TEMP/drift/report.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: drift-report
          path: ${{ runner.temp }}/drift/

  latest-conformance:
    name: Latest reference release conformance
    needs: detect
    if: needs.detect.outputs.reference_release_newer == 'true'
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.verify.outcome }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Checkout latest reference release
        env:
          REFERENCE_DIR: ${{ runner.temp }}/knit-spool-reference
          REFERENCE_REPO: ${{ needs.detect.outputs.reference_repo }}
          REFERENCE_COMMIT: ${{ needs.detect.outputs.reference_release_commit }}
        run: |
          git clone --filter=blob:none "https://github.com/$REFERENCE_REPO.git" "$REFERENCE_DIR"
          git -C "$REFERENCE_DIR" checkout --detach "$REFERENCE_COMMIT"
      - name: Run conformance and differential checks against it
        id: verify
        continue-on-error: true
        env:
          KNIT_REFERENCE_UNPINNED: "1"
        run: scripts/verify-reference.sh "${{ runner.temp }}/knit-spool-reference"

  knit-client:
    name: Latest Knit client against this spool
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      result: ${{ steps.e2e.outcome }}
      release: ${{ steps.release.outputs.tag }}
    env:
      # Knit's own CI needs a 4 GB Gradle heap to compile :app's unit tests.
      GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4g -Dfile.encoding=UTF-8'"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v5
      - name: Find the latest Knit release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/getknit/knit/releases/latest --jq .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Checkout the Knit client
        env:
          TAG: ${{ steps.release.outputs.tag }}
          GIT_LFS_SKIP_SMUDGE: "1"
        run: git clone --depth 1 --branch "$TAG" https://github.com/getknit/knit.git "$RUNNER_TEMP/knit"
      - name: Run the Knit client against this spool
        id: e2e
        continue-on-error: true
        run: scripts/knit-client-e2e.sh "$RUNNER_TEMP/knit"
      - uses: actions/upload-artifact@v7
        if: steps.e2e.outcome == 'failure'
        with:
          name: knit-client-test-report
          path: ${{ runner.temp }}/knit/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  client-report:
    name: Update Knit client issue
    needs: knit-client
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open, update or close the Knit client issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JOB: ${{ needs.knit-client.result }}
          RESULT: ${{ needs.knit-client.outputs.result }}
          RELEASE: ${{ needs.knit-client.outputs.release }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label=knit-client-e2e
          gh label create "$label" --color B60205 \
            --description "The latest Knit client fails against this spool" --force >/dev/null
          issue=$(gh issue list --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')

          if [[ "$JOB:$RESULT" == success:success ]]; then
            if [[ -n "$issue" ]]; then
              gh issue close "$issue" --comment "Knit client \`$RELEASE\` passes against this spool on [this run]($RUN_URL)."
            fi
            exit 0
          fi

          if [[ "$JOB:$RESULT" == success:failure ]]; then
            what="Knit client \`$RELEASE\` **fails** against this spool."
          else
            what="The Knit client job did not complete ($JOB) for \`${RELEASE:-unknown release}\`."
          fi
          key="${RELEASE:-unknown}:$JOB:$RESULT"
          body=$(cat <<EOF
          $what

          The weekly upstream drift workflow runs [\`scripts/knit-client-e2e.sh\`](https://github.com/$GH_REPO/blob/main/scripts/knit-client-e2e.sh): the latest released Knit app's own link parser, dialer and connection code, on the JVM, against a freshly built knit-spool. A failure can be a regression here, a client change this spool must follow, or a change in Knit's internal test seams that only needs the test updated. See the [run log]($RUN_URL); the Gradle test report is attached to the run when the test itself failed.

          <!-- client-key: $key -->
          EOF
          )
          title="Knit client e2e fails: ${RELEASE:-unknown}"
          if [[ -n "$issue" ]]; then
            previous=$(gh issue view "$issue" --json body --jq .body | tr -d '\r' | sed -n 's/^ *<!-- client-key: \(.*\) -->$/\1/p')
            gh issue edit "$issue" --title "$title" --body "$body"
            if [[ "$previous" != "$key" ]]; then
              gh issue comment "$issue" --body "Still failing, now \`$key\`. [Run]($RUN_URL)"
            fi
          else
            gh issue create --title "$title" --label "$label" --body "$body"
          fi

  report:
    name: Update tracking issue
    needs: [detect, latest-conformance]
    if: always() && needs.detect.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: drift-report
          path: drift
      - name: Create, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRIFT: ${{ needs.detect.outputs.drift }}
          LEVEL: ${{ needs.detect.outputs.level }}
          DRIFT_KEY: ${{ needs.detect.outputs.drift_key }}
          RELEASE: ${{ needs.detect.outputs.reference_release }}
          CONFORMANCE_JOB: ${{ needs.latest-conformance.result }}
          CONFORMANCE: ${{ needs.latest-conformance.outputs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label=upstream-drift
          gh label create "$label" --color D93F0B \
            --description "Upstream Knit moved past knit-reference.lock" --force >/dev/null
          issue=$(gh issue list --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')

          if [[ "$DRIFT" != true ]]; then
            if [[ -n "$issue" ]]; then
              gh issue close "$issue" --comment "No drift on [this run]($RUN_URL): the pins match upstream."
            fi
            exit 0
          fi

          body=drift/issue-body.md
          {
            echo
            echo "## Latest reference conformance"
            echo
            case "$CONFORMANCE_JOB:$CONFORMANCE" in
              success:success) echo "Passed against reference release \`$RELEASE\`." ;;
              success:failure) echo "**Failed** against reference release \`$RELEASE\`. A failure can also come from a changed runner interface or an intended behavior change in the Kotlin reference; see the [run log]($RUN_URL)." ;;
              skipped:*) echo "Not run: no reference release newer than the pin." ;;
              *) echo "Did not complete ($CONFORMANCE_JOB); see the [run log]($RUN_URL)." ;;
            esac
            echo
            echo "_Updated by [upstream drift run]($RUN_URL)._"
            echo
            echo "<!-- drift-key: $DRIFT_KEY -->"
          } >> "$body"

          title="Upstream Knit drift: $LEVEL"
          if [[ -n "$issue" ]]; then
            previous=$(gh issue view "$issue" --json body --jq .body | tr -d '\r' | sed -n 's/^<!-- drift-key: \(.*\) -->$/\1/p')
            gh issue edit "$issue" --title "$title" --body-file "$body"
            # Body edits notify nobody; comment when the drift itself changed.
            if [[ "$previous" != "$DRIFT_KEY" ]]; then
              gh issue comment "$issue" --body "Upstream drift changed (\`$DRIFT_KEY\`); the description has the new report. [Run]($RUN_URL)"
            fi
          else
            gh issue create --title "$title" --label "$label" --body-file "$body"
          fi
